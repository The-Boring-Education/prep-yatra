<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepYatra - Turn Hustle Into Hires</title>
  <meta name="description"
    content="The ultimate community platform for job hunters to store recruiter contacts, share prep logs, and crowdsource resources together." />
  <meta name="author" content="The Boring Education" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-title" content="Prep Yatra" />
  <link rel="touch-icon" href="/apple-touch-icon.png" />

  <!-- Preload critical resources -->
  <link rel="preload" href="/src/main.tsx" as="script" />
  <link rel="preload" href="/src/index.css" as="style" />

  <!-- DNS Prefetch for external domains -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="dns-prefetch" href="//cdn.gpteng.co" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="PrepYatra - Turn Hustle Into Hires" />
  <meta property="og:description"
    content="The ultimate community platform for job hunters to store recruiter contacts, share prep logs, and crowdsource resources together." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://prepyatra.theboringeducation.com" />
  <meta property="og:image" content="https://prepyatra.theboringeducation.com/og-image.png" />

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@theboringeducation" />
  <meta name="twitter:title" content="PrepYatra - Turn Hustle Into Hires" />
  <meta name="twitter:description"
    content="The ultimate community platform for job hunters to store recruiter contacts, share prep logs, and crowdsource resources together." />
  <meta name="twitter:image" content="https://prepyatra.theboringeducation.com/og-image.png" />

  <!-- Additional SEO Meta Tags -->
  <meta name="keywords"
    content="job hunting, career, interview preparation, recruiter contacts, job search community, career development" />
  <link rel="canonical" href="https://prepyatra.theboringeducation.com" />

  <!-- Sitemap -->
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

  <!-- SPA Routing Fallback Script -->
  <script>
    // Handle SPA routing for direct URL access
    (function () {
      // Check if this is a direct access to a route
      var path = window.location.pathname
      var isDirectAccess = path !== '/' && !path.startsWith('/api') && !path.includes('.')

      if (isDirectAccess) {
        // Store the intended path for the React app to handle
        sessionStorage.setItem('directAccessPath', path + window.location.search + window.location.hash)
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
